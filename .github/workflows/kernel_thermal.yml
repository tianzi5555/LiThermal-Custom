name: Kernel-thermal
# Build a T113 (Tina Linux 5.4.61) kernel with the thermal sensor driver enabled.
# CONFIG_THERMAL is a bool and is currently off, so SUNXI_THERMAL cannot be a module.
# Only two options are forced on; everything else keeps the camera's original config.
# Only zImage is built: the thermal node (2009400.ths) already exists in the camera dtb.
# Allwinner's zImage target depends on dtbs -> board.dtb, which this config does not
# define, so we touch a placeholder first.

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/kernel_thermal.yml"
      - ".github/kernel/**"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev libncurses5-dev rsync cpio kmod python3 wget xz-utils device-tree-compiler

      - name: toolchain
        run: |
          git clone --depth 1 https://github.com/diylxy/LiThermal_Compiler.git tc
          ls tc/toolchain-sunxi-musl/toolchain/bin | grep -E 'gcc' | head -5

      - name: kernel-src
        run: |
          git clone --depth 1 https://github.com/Noooooob233/tina-d1-linux-5.4.git linux
          cd linux
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile
          touch .scmversion

      - name: config
        run: |
          set -e
          export PATH="$GITHUB_WORKSPACE/tc/toolchain-sunxi-musl/toolchain/bin:$PATH"
          export ARCH=arm
          export CROSS_COMPILE=arm-openwrt-linux-muslgnueabi-
          export STAGING_DIR="$GITHUB_WORKSPACE/tc/target"
          cd linux
          cp "$GITHUB_WORKSPACE/.github/kernel/t113_kernel.config" .config
          force_kv() {
            if grep -q "^# CONFIG_$1 is not set" .config; then
              sed -i "s/^# CONFIG_$1 is not set/CONFIG_$1=$2/" .config
            elif grep -q "^CONFIG_$1=" .config; then
              sed -i "s/^CONFIG_$1=.*/CONFIG_$1=$2/" .config
            else
              echo "CONFIG_$1=$2" >> .config
            fi
          }
          force_kv THERMAL y
          force_kv SUNXI_THERMAL y
          force_kv THERMAL_OF y
          # THS 需要 SID/efuse 的校准数据，必须让 SID 注册成 nvmem provider
          force_kv NVMEM y
          force_kv NVMEM_SUNXI_SID y
          force_kv SUNXI_SID y
          force_kv EEPROM_SUNXI_SID y
          force_kv SID y
          force_kv SUNXI_NVMEM y
          make ARCH=arm CROSS_COMPILE=$CROSS_COMPILE olddefconfig
          echo "=== check ==="
          grep -E '^CONFIG_(THERMAL|SUNXI_THERMAL|THERMAL_OF|MODVERSIONS|MODULE_SIG|LOCALVERSION)' .config || true
          grep -q '^CONFIG_THERMAL=y' .config || { echo "THERMAL not enabled"; exit 1; }
          grep -q '^CONFIG_SUNXI_THERMAL=y' .config || { echo "SUNXI_THERMAL not enabled"; exit 1; }

      - name: build-zImage
        run: |
          set -o pipefail
          export PATH="$GITHUB_WORKSPACE/tc/toolchain-sunxi-musl/toolchain/bin:$PATH"
          export ARCH=arm
          export CROSS_COMPILE=arm-openwrt-linux-muslgnueabi-
          export STAGING_DIR="$GITHUB_WORKSPACE/tc/target"
          cd linux
          touch arch/arm/boot/dts/board.dtb
          make -j"$(nproc)" zImage 2>&1 | tail -50
          echo "===== artifact ====="
          ls -l arch/arm/boot/zImage
          cat include/config/kernel.release 2>/dev/null || true

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: t113-kernel-thermal
          path: linux/arch/arm/boot/zImage
          if-no-files-found: warn
