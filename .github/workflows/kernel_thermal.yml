name: Build T113 kernel with thermal sensor (CPU temp)

# 缁?LiThermal 鐩告満锛圱113-S3 / Tina Linux 5.4.61锛夌紪涓€涓€愬甫娓╁害浼犳劅鍣ㄩ┍鍔ㄣ€戠殑鍐呮牳銆?#
# 涓轰粈涔堝繀椤婚噸缂栧唴鏍歌€屼笉鏄姞妯″潡锛?#   CONFIG_THERMAL锛坱hermal 妗嗘灦鏍稿績锛夋槸 bool锛屽彧鑳藉唴寤猴紱鐩告満鐜板湪娌″紑锛?#   鎵€浠?SINXI_THERMAL 鍗充究鏄?tristate 涔熸病娉曞崟鐙紪鎴愭ā鍧楃敤銆?#
# 鍙敼涓ゅ銆佸埆鐨勪繚鎸佺浉鏈哄師閰嶇疆锛?#   CONFIG_THERMAL=y
#   CONFIG_SUNXI_THERMAL=y
# vermagic 浠嶆槸 5.4.61 SMP preempt...锛屾墍浠ョ幇鏈夌殑搴旂敤鍜屽叾瀹冩ā鍧椾笉鍙楀奖鍝嶃€?
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/kernel_thermal.yml"
      - ".github/kernel/**"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: 鍙栧嚭鏈粨搴?        uses: actions/checkout@v4

      - name: 瀹夎渚濊禆
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev \
            libncurses5-dev rsync cpio kmod python3 wget xz-utils device-tree-compiler

      - name: 鎷夊彇浜ゅ弶宸ュ叿閾撅紙涓庣浉鏈哄唴鏍稿悓娆?gcc 6.4.1 musl锛?        run: |
          git clone --depth 1 https://github.com/diylxy/LiThermal_Compiler.git tc
          ls tc/toolchain-sunxi-musl/toolchain/bin | grep -E 'gcc' | head -5

      - name: 鎷夊彇鍐呮牳婧愮爜锛圱113 Tina Linux 5.4.61锛?        run: |
          git clone --depth 1 https://github.com/Noooooob233/tina-d1-linux-5.4.git linux
          cd linux
          head -5 Makefile
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile
          touch .scmversion

      - name: 鐢ㄧ浉鏈洪厤缃?+ 鎵撳紑娓╁害椹卞姩
        run: |
          set -e
          export PATH="$GITHUB_WORKSPACE/tc/toolchain-sunxi-musl/toolchain/bin:$PATH"
          export ARCH=arm
          export CROSS_COMPILE=arm-openwrt-linux-muslgnueabi-
          export STAGING_DIR="$GITHUB_WORKSPACE/tc/target"
          cd linux
          cp "$GITHUB_WORKSPACE/.github/kernel/t113_kernel.config" .config
          force_kv() {
            if grep -q "^# CONFIG_$1 is not set" .config; then
              sed -i "s/^# CONFIG_$1 is not set/CONFIG_$1=$2/" .config
            elif grep -q "^CONFIG_$1=" .config; then
              sed -i "s/^CONFIG_$1=.*/CONFIG_$1=$2/" .config
            else
              echo "CONFIG_$1=$2" >> .config
            fi
          }
          force_kv THERMAL y
          force_kv SUNXI_THERMAL y
          force_kv THERMAL_OF y
          force_kv THERMAL_WRITABLE_TRIPS n
          force_kv THERMAL_DEFAULT_GOV_STEP_WISE y
          # 鐩告満鍐呮牳娌″鍑?__stack_chk_guard锛屼繚鎸佷笌鍘熷唴鏍镐竴鑷寸殑鏍堜繚鎶よ缃紙鍘熼厤缃氨鏄?y锛屽埆鍔級
          make ARCH=arm CROSS_COMPILE=$CROSS_COMPILE olddefconfig
          echo "=== 纭 ==="
          grep -E '^CONFIG_(THERMAL|SUNXI_THERMAL|THERMAL_OF|MODVERSIONS|MODULE_SIG|LOCALVERSION)' .config || true
          grep -q '^CONFIG_THERMAL=y' .config || { echo "!! THERMAL 娌℃墦寮€"; exit 1; }
          grep -q '^CONFIG_SUNXI_THERMAL=y' .config || { echo "!! SUNXI_THERMAL 娌℃墦寮€"; exit 1; }

      - name: 缂栬瘧鍐呮牳涓庤澶囨爲
        run: |
          set -o pipefail
          export PATH="$GITHUB_WORKSPACE/tc/toolchain-sunxi-musl/toolchain/bin:$PATH"
          export ARCH=arm
          export CROSS_COMPILE=arm-openwrt-linux-muslgnueabi-
          export STAGING_DIR="$GITHUB_WORKSPACE/tc/target"
          cd linux
          make -j"$(nproc)" zImage 2>&1 | tail -60
          echo "===== 浜х墿 ====="
          ls -l arch/arm/boot/zImage
          echo "===== vermagic 鏉ユ簮锛堝唴鏍哥増鏈級====="
          cat include/config/kernel.release 2>/dev/null || true
          strings arch/arm/boot/zImage | grep -m3 '5\.4\.61'

      - name: 涓婁紶鍐呮牳
        uses: actions/upload-artifact@v4
        with:
          name: t113-kernel-thermal
          path: |
            linux/arch/arm/boot/zImage
          if-no-files-found: warn
