name: Build mt76 (MT7612U) kernel modules for LiThermal camera

# 缁?LiThermal 鐑垚鍍忕浉鏈猴紙T113-S3 / Tina Linux 5.4.61锛夌紪璇?MT7612U 鐨?WiFi 椹卞姩妯″潡銆?#
# 渚濇嵁锛堝叏閮ㄥ疄娴嬭嚜鐩告満锛夛細
#   * uname -r = 5.4.61锛岀紪璇戝櫒 arm-openwrt-linux-muslgnueabi-gcc 6.4.1
#   * CONFIG_MODVERSIONS 鏈紑 鈫?涓嶉渶瑕佺鍙?CRC
#   * CONFIG_MODULE_SIG 鏈紑 鈫?涓嶉渶瑕佹ā鍧楃鍚?#   * CONFIG_CFG80211=y锛堝唴寤猴級銆丆ONFIG_MAC80211 鏈紑 鈫?mac80211 闇€瑕佷竴璧风紪鎴愭ā鍧?#   * CONFIG_RFKILL=y銆丆RYPTO_CCM/AES/ARC4=y 鉁?# 鍥犳鍙鍐呮牳鐗堟湰涓蹭竴鑷达紙5.4.61 SMP PREEMPT锛夛紝缂栧嚭鏉ョ殑 .ko 灏辫兘鐩存帴 insmod銆?
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build_mt76.yml"
      - ".github/kernel/**"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: 鍙栧嚭鏈粨搴?        uses: actions/checkout@v4

      - name: 瀹夎渚濊禆
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev \
            libncurses5-dev rsync cpio kmod python3 wget xz-utils

      - name: 鎷夊彇浜ゅ弶宸ュ叿閾撅紙涓庣浉鏈哄唴鏍稿悓娆?gcc 6.4.1 musl锛?        run: |
          git clone --depth 1 https://github.com/diylxy/LiThermal_Compiler.git tc
          ls tc/toolchain-sunxi-musl/toolchain/bin | head -5
          test -x tc/toolchain-sunxi-musl/toolchain/bin/arm-openwrt-linux-muslgnueabi-gcc.bin \
            && echo "宸ュ叿閾?OK" || echo "璀﹀憡锛氭湭鎵惧埌 gcc 瀹炰綋鏂囦欢"

      - name: 鎷夊彇鍐呮牳婧愮爜锛圱113 Tina Linux 5.4.61锛?        run: |
          git clone --depth 1 https://github.com/Noooooob233/tina-d1-linux-5.4.git linux
          cd linux
          head -5 Makefile
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile
          # 鍏抽敭锛氬唴鏍告爲鏄?git 浠撳簱涓斾細琚垜浠敼鍔?鈫?setlocalversion 浼氬姞 "+"锛?          # 瀵艰嚧 vermagic 鍙樻垚 5.4.61+ 鑰岀浉鏈烘槸 5.4.61锛坕nsmod 浼氳鎷掞級銆?          # 鏀句竴涓┖鐨?.scmversion 灏辫兘璁╁畠涓嶅啀杩藉姞浠讳綍涓滆タ銆?          touch .scmversion
          echo "宸叉斁缃?.scmversion锛堟秷闄?vermagic 鐨?+ 鍚庣紑锛?

      - name: 濂楃敤鐩告満鍐呮牳閰嶇疆骞舵墦寮€ mt76/mac80211
        run: |
          set -e
          export PATH="$GITHUB_WORKSPACE/tc/toolchain-sunxi-musl/toolchain/bin:$PATH"
          export ARCH=arm
          export CROSS_COMPILE=arm-openwrt-linux-muslgnueabi-
          export STAGING_DIR="$GITHUB_WORKSPACE/tc/target"
          echo "=== 工具链自检 ==="
          ls -l "$GITHUB_WORKSPACE/tc/toolchain-sunxi-musl/toolchain/bin" | grep -E 'gcc|wrapper' | head -8
          ${CROSS_COMPILE}gcc --version | head -2 || echo "!! gcc 璺戜笉璧锋潵"
          cd linux
          cp "$GITHUB_WORKSPACE/.github/kernel/t113_kernel.config" .config
          # 绗竴閬嶏細鍏堟妸 WLAN_VENDOR_MEDIATEK 鎵撳紑骞?olddefconfig锛?          # 杩欐牱 mediatek/mt76 鐨?Kconfig 鎵嶈 source 杩涙潵锛屼笅闈㈠啓 MT76x2U 鎵嶆湁鏁堛€?          ./scripts/config --enable WLAN_VENDOR_MEDIATEK
          ./scripts/config --enable WLAN_VENDOR_REALTEK || true
          ./scripts/config --module MAC80211
          make ARCH=arm CROSS_COMPILE=$CROSS_COMPILE olddefconfig
          echo "=== 绗竴閬嶄箣鍚庯細mediatek/mt76 鐩稿叧绗﹀彿 ==="
          grep -E '^(CONFIG_WLAN_VENDOR_MEDIATEK|CONFIG_MAC80211|CONFIG_MT76|CONFIG_USB)=|^# CONFIG_MT76' .config || true
          # 绗簩閬嶏細鐜板湪 MT76x2U / MT76x2_COMMON 鎵嶆槸鍙缃殑绗﹀彿
          ./scripts/config --module MT76x2U
          ./scripts/config --module MT76x2_COMMON
          ./scripts/config --module MT76x02_USB
          ./scripts/config --module MT76_USB
          ./scripts/config --module MT76_CORE
          ./scripts/config --module MT76x0U
          ./scripts/config --module CRC_CCITT || true
          ./scripts/config --module CRYPTO_MICHAEL_MIC || true
          ./scripts/config --module AVERAGE || true
          ./scripts/config --module CRYPTO_GCM || true
          make ARCH=arm CROSS_COMPILE=$CROSS_COMPILE olddefconfig
          echo "=== 鍏抽敭椤圭‘璁?==="
          grep -E '^(CONFIG_WLAN_VENDOR_MEDIATEK|CONFIG_MAC80211|CONFIG_MT76|CONFIG_MT76x2_COMMON|CONFIG_CFG80211|CONFIG_RFKILL)=' .config || true
          grep -E '^CONFIG_MODVERSIONS|^CONFIG_MODULE_SIG' .config || true
          # 鑷锛氬繀椤荤湡鐨勮鍒颁簡杩欏嚑涓?=m锛堟敞鎰忔湰鍐呮牳绗﹀彿鍚嶆槸 MT76_CORE / MT76x2U锛?          for k in CONFIG_MAC80211 CONFIG_MT76_CORE CONFIG_MT76x2U; do
            if ! grep -q "^$k=m" .config; then
              echo "!! $k 娌℃湁鍙樻垚 =m"; echo "--- 褰撳墠 MT76 鐩稿叧锛?; grep -E 'MT76' .config || true; exit 1
            fi
          done
          echo "閰嶇疆鑷閫氳繃 鉁?

      - name: 缂栬瘧鍐呮牳妯″潡
        run: |
          set -o pipefail
          export PATH="$GITHUB_WORKSPACE/tc/toolchain-sunxi-musl/toolchain/bin:$PATH"
          export ARCH=arm
          export CROSS_COMPILE=arm-openwrt-linux-muslgnueabi-
          export STAGING_DIR="$GITHUB_WORKSPACE/tc/target"
          echo "=== 工具链自检 ==="
          which ${CROSS_COMPILE}gcc || ls -l tc/toolchain-sunxi-musl/toolchain/bin | head
          cd linux
          make -j"$(nproc)" modules 2>&1 | tail -80
          echo "=== 鎵惧嚭鏉ョ殑 .ko ==="
          find . -name 'mac80211.ko' -o -name 'mt76*.ko' -o -name 'mt7601u.ko' -o -name 'crc-ccitt.ko' -o -name 'michael_mic.ko' | sort

      - name: 鏀堕泦浜х墿 + 鎵撳嵃 vermagic
        run: |
          set -e
          mkdir -p out
          cd linux
          for f in $(find . -name 'mac80211.ko' -o -name 'mt76*.ko' -o -name 'mt7601u.ko' \
                          -o -name 'crc-ccitt.ko' -o -name 'michael_mic.ko' -o -name 'cfg80211.ko' \
                          -o -name 'rfkill.ko' -o -name 'lib80211*.ko' -o -name 'aes*.ko' -o -name 'arc4.ko' \
                          -o -name 'ccm.ko' -o -name 'gcm.ko' -o -name 'crypto*.ko' -o -name 'crc32*.ko'); do
            cp "$f" "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          done
          cd "$GITHUB_WORKSPACE/out"
          ls -l
          # 鏍稿績鑷锛歮t76x2u.ko 蹇呴』鍦?          if [ ! -f mt76x2u.ko ]; then echo "!! 娌＄紪鍑?mt76x2u.ko"; exit 1; fi
          for k in *.ko; do
            echo "--- $k"
            modinfo "$k" 2>/dev/null | grep -E '^(version|vermagic|depends|name):' || true
          done
          echo "=== vermagic 蹇呴』鎭板ソ鏄細5.4.61 SMP preempt mod_unload ARMv7 p2v8 ==="
          bad=0
          for k in *.ko; do
            v=$(modinfo -F vermagic "$k" 2>/dev/null || true)
            case "$v" in
              "5.4.61 SMP preempt mod_unload ARMv7 p2v8"*) echo "  $k  鉁?$v" ;;
              *) echo "  $k  鉁?$v"; bad=1 ;;
            esac
          done
          [ "$bad" = "0" ] || { echo "!! 鏈夋ā鍧?vermagic 涓嶅尮閰?; exit 1; }

      - name: 涓婁紶妯″潡
        uses: actions/upload-artifact@v4
        with:
          name: mt76-modules
          path: out/*.ko
          if-no-files-found: error
