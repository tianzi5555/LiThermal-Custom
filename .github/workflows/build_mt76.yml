name: Build mt76 (MT7612U) kernel modules for LiThermal camera

# 给 LiThermal 热成像相机（T113-S3 / Tina Linux 5.4.61）编译 MT7612U 的 WiFi 驱动模块。
#
# 依据（全部实测自相机）：
#   * uname -r = 5.4.61，编译器 arm-openwrt-linux-muslgnueabi-gcc 6.4.1（同一套工具链在 LiThermal_Compiler 里）
#   * CONFIG_MODVERSIONS 未开 → 不需要符号 CRC
#   * CONFIG_MODULE_SIG  未开 → 不需要模块签名
#   * CONFIG_CFG80211=y（内建）、CONFIG_MAC80211 未开 → mac80211 要一起编成模块
#   * CONFIG_RFKILL=y / CRYPTO_CCM,AES,ARC4=y → 依赖齐
#   * 相机现有模块的 vermagic 恰好是：5.4.61 SMP preempt mod_unload ARMv7 p2v8
# 所以只要内核版本串一致，编出来的 .ko 就能直接 insmod。

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build_mt76.yml"
      - ".github/kernel/**"

env:
  ARCH: arm
  CROSS_COMPILE: arm-openwrt-linux-muslgnueabi-
  TOOLCHAIN_DIR: ${{ github.workspace }}/tc/toolchain-sunxi-musl/toolchain/bin
  STAGING_DIR: ${{ github.workspace }}/tc/target

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: 取出本仓库
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev \
            libncurses5-dev rsync cpio kmod python3 wget xz-utils

      - name: 拉取交叉工具链
        run: |
          git clone --depth 1 https://github.com/diylxy/LiThermal_Compiler.git tc
          ls "$TOOLCHAIN_DIR" | grep -E 'gcc|wrapper' | head -8
          export PATH="$TOOLCHAIN_DIR:$PATH"
          ${CROSS_COMPILE}gcc --version | head -2

      - name: 拉取内核源码（T113 Tina Linux 5.4.61）
        run: |
          git clone --depth 1 https://github.com/Noooooob233/tina-d1-linux-5.4.git linux
          cd linux
          head -5 Makefile
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile
          # 内核树是 git 仓库且会被我们改动，setlocalversion 会加 "+"，
          # 使 vermagic 变成 5.4.61+，而相机是 5.4.61（insmod 会被拒）。
          # 空的 .scmversion 可以让它不再追加任何东西。
          touch .scmversion
          echo "已放置 .scmversion"

      - name: 配置内核（两遍，先开 vendor 再开 mt76）
        run: |
          set -e
          export PATH="$TOOLCHAIN_DIR:$PATH"
          cd linux
          cp "$GITHUB_WORKSPACE/.github/kernel/t113_kernel.config" .config

          # 第一遍：打开 mediatek 无线厂商开关并 olddefconfig，
          # 让 mediatek/mt76 的 Kconfig 被 source 进来。
          ./scripts/config --enable WLAN_VENDOR_MEDIATEK
          ./scripts/config --enable WLAN_VENDOR_REALTEK || true
          ./scripts/config --module MAC80211
          make olddefconfig
          echo "=== 第一遍之后 ==="
          grep -E '^(CONFIG_WLAN_VENDOR_MEDIATEK|CONFIG_MAC80211|CONFIG_USB)=' .config || true
          grep -E '^CONFIG_MT76' .config || echo "(还没有 MT76 符号)"

          # 第二遍：本内核的符号名是 MT76_CORE / MT76_USB / MT76x02_USB / MT76x2_COMMON / MT76x2U
          ./scripts/config --module MT76x2U
          ./scripts/config --module MT76x2_COMMON
          ./scripts/config --module MT76x02_USB
          ./scripts/config --module MT76_USB
          ./scripts/config --module MT76_CORE
          ./scripts/config --module CRC_CCITT || true
          ./scripts/config --module CRYPTO_MICHAEL_MIC || true
          ./scripts/config --module AVERAGE || true
          ./scripts/config --module CRYPTO_GCM || true
          make olddefconfig

          echo "=== 关键项 ==="
          grep -E '^(CONFIG_WLAN_VENDOR_MEDIATEK|CONFIG_MAC80211|CONFIG_MT76|CONFIG_CFG80211|CONFIG_RFKILL)=' .config || true
          grep -E '^CONFIG_MODVERSIONS|^CONFIG_MODULE_SIG' .config || true

          for k in CONFIG_MAC80211 CONFIG_MT76_CORE CONFIG_MT76x2U; do
            if ! grep -q "^$k=m" .config; then
              echo "!! $k 没有变成 =m"
              grep -E 'MT76' .config || true
              exit 1
            fi
          done
          echo "配置自检通过"

      - name: 编译内核模块
        run: |
          set -o pipefail
          export PATH="$TOOLCHAIN_DIR:$PATH"
          cd linux
          make -j"$(nproc)" modules 2>&1 | tail -60
          echo "=== 找到的 .ko ==="
          find . -name 'mac80211.ko' -o -name 'mt76*.ko' -o -name 'crc-ccitt.ko' -o -name 'michael_mic.ko' | sort

      - name: 收集产物并自检 vermagic
        run: |
          set -e
          mkdir -p out
          cd linux
          for f in $(find . \( -name 'mac80211.ko' -o -name 'mt76*.ko' -o -name 'crc-ccitt.ko' \
                          -o -name 'michael_mic.ko' -o -name 'cfg80211.ko' -o -name 'rfkill.ko' \
                          -o -name 'lib80211*.ko' -o -name 'aes*.ko' -o -name 'arc4.ko' -o -name 'ccm.ko' \) ); do
            cp "$f" "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          done
          cd "$GITHUB_WORKSPACE/out"
          ls -l
          if [ ! -f mt76x2u.ko ]; then echo "!! 没编出 mt76x2u.ko"; exit 1; fi
          WANT="5.4.61 SMP preempt mod_unload ARMv7 p2v8"
          bad=0
          for k in *.ko; do
            v=$(modinfo -F vermagic "$k" 2>/dev/null | awk '{print $1" "$2" "$3" "$4" "$5" "$6}')
            echo "$k  ->  $v"
            [ "$v" = "$WANT" ] || bad=1
          done
          [ "$bad" = "0" ] || { echo "!! vermagic 不匹配（相机要求：$WANT）"; exit 1; }
          echo "vermagic 全部匹配"

      - name: 上传模块
        uses: actions/upload-artifact@v4
        with:
          name: mt76-modules
          path: out/*.ko
          if-no-files-found: error
